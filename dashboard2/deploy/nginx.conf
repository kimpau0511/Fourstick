# dashboard2 배포 형태 시험용 nginx 설정 — build 결과(dist/)를 내보내고, 서버 API는 백엔드로 넘긴다.
#
# 화면은 /health·/v1/*를 **같은 주소**로 부른다(웹소켓 포함: /v1/sim-view/stream·/v1/scene/stream·/v1/stt).
# 그래서 nginx 한 주소 뒤에 화면과 API를 같이 두면 CORS 없이 그대로 동작한다(vite 개발 서버 프록시와 같은 구조).
#
# 실행(Windows, 이 폴더 기준): deploy/README.md
#
# 지키는 것:
# - 127.0.0.1에서만 연다. 백엔드에 인증이 아직 없다 — 제어 API(명령·승인·실행·정지)가 그대로 넘어가므로
#   LAN·외부에 열기 전에 인증이 먼저다(vite.config.js와 같은 이유).
# - 백엔드 주소는 아래 두 줄(proxy_pass·proxy_ssl_name)뿐이다. 작업 셀 주소가 바뀌면 여기만 고친다.

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events { worker_connections 256; }

http {
  # build 결과에 나오는 종류만(dist: html·js·css, 이미지는 js 안에 들어간다)
  types {
    text/html html;
    application/javascript js mjs;
    text/css css;
    image/svg+xml svg;
    image/png png;
    application/json json;
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;
  access_log logs/access.log;
  sendfile on;

  # 웹소켓 업그레이드: Upgrade 헤더가 있을 때만 Connection: upgrade
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 127.0.0.1:8088;
    root ../dist;

    # 화면은 해시 주소(#/robots)라 서버 경로는 / 하나다. index.html은 매번 새로 받는다(새 build가 바로 보이게).
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
    # 서비스 워커는 매번 새로 확인해야 새 build가 퍼진다.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    # build 파일 이름에 내용 해시가 붙는다 — 오래 캐시해도 된다.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location ~ ^/(health|v1/) {
      proxy_pass https://foursticks.xos.kr;
      proxy_ssl_server_name on;
      proxy_ssl_name foursticks.xos.kr;
      proxy_set_header Host foursticks.xos.kr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # 실행(/v1/execute)은 끝날 때까지 응답하지 않는다(이송 수십 초~분) — 기본 60초에서 끊지 않게.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      # 상태 조회·영상 스트림을 모아 두지 않고 바로 넘긴다.
      proxy_buffering off;
    }
  }
}
