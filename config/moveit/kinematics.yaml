# FR3-WMS arm-only 역기구학 설정 (8-07). 우리 파일이다.
#
# KDL을 쓴다. 설치된 moveit_kinematics(2.15.0)에 함께 들어 있는 수치해
# 플러그인이다. **IKFast·TRAC-IK 같은 별도 solver를 만들지 않는다** — 공식
# 기구학 파라미터를 확인하지 않은 상태에서 solver를 손으로 조정하지 않는다.
fr3wms_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
