# 2F-85 그리퍼 컨트롤러 (8-08, Gazebo 경로). 우리 파일이다.
#
# 공식 robotiq_description의 Lyrical 설정은 실기 하드웨어의
# `set_gripper_max_effort` / `set_gripper_max_velocity` 명령 인터페이스를
# 요구한다. **Gazebo에는 그 인터페이스가 없다**(gz_ros2_control은 position
# 명령만 노출한다). 그래서 여기서는 두 인터페이스를 쓰지 않는다.
#
# **파지력을 시뮬레이션에서 주장하지 않는다.** effort(50 N·m)와 실제 파지력
# (20~235 N)은 다른 값이고, 서로 변환하지 않는다. 그래서 max_effort를 적지
# 않는다 — 대신 관측(개구·접촉)으로만 판정한다.
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz (팔 컨트롤러와 같은 주기)
    use_sim_time: true

    # 단순 조립 셀(scripts/run_gazebo_fr3_gripper.sh)이 쓰는 경로다.
    # **작업 셀에서는 쓰지 않는다** — 아래 gripper_trajectory_controller 주석의
    # 실측 근거를 본다. 8-08의 단순 셀 결과를 보존하려고 정의만 남긴다.
    gripper_action_controller:
      type: parallel_gripper_action_controller/GripperActionController

    # **작업 셀의 기본 그리퍼 경로다**(8-08 우선순위 2에서 확정).
    #
    # GripperActionController는 목표 위치를 계단 명령으로 넣는다. gz_ros2_control이
    # 그 위치 오차를 position_proportional_gain(0.1)으로 속도로 바꾸기 때문에
    # 관절이 일정 속도 약 0.357 rad/s로 램프하며 **목표를 지나쳐** 관절 제한
    # 0.8 rad까지 가고 거기서 잠긴다(그 뒤 open 명령도 듣지 않는다).
    #
    # 같은 하드웨어 인터페이스·같은 mimic 설정·같은 물리에서 컨트롤러만 바꿔
    # 실측했다:
    #   GripperActionController  0.0 -> 0.537991 rad  최대 0.800000 (초과 +0.262)
    #   JointTrajectoryController 0.0 -> 0.537991 rad  최대 0.537991 (초과 +0.000)
    # 궤적 보간은 매 주기 명령 위치가 현재 위치에 가까워 램프가 목표를 지나치지
    # 않는다. STOP도 이 경로에서 관측 속도 0으로 확인된다.
    #
    # 근거: reports/workcell/gripper_control.json
    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gripper_action_controller:
  ros__parameters:
    use_sim_time: true
    joint: robotiq_85_left_knuckle_joint
    state_interfaces:
      - position
      - velocity
    # 목표 도달 판정은 우리 검증기가 관측 개구로 한다. 컨트롤러 결과를
    # 성공 근거로 쓰지 않는다.
    allow_stalling: true
    stall_timeout: 0.2
    stall_velocity_threshold: 0.001
    goal_tolerance: 0.02   # rad

gripper_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # 목표를 지나치지 않게 궤적을 보간한다. 허용치는 관측 개구 판정과
    # 같은 근거(컨트롤러 goal_tolerance 0.02 rad)를 쓴다.
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      robotiq_85_left_knuckle_joint:
        trajectory: 0.1
        goal: 0.02
